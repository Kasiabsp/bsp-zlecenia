<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Panel admin — BSP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;padding:28px;background:#f6f7fb}
    .card{max-width:900px;margin:20px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    h2{margin-top:0}
    textarea{width:100%;min-height:120px;padding:10px;border-radius:8px;border:1px solid #e6e9ee}
    button{padding:10px 14px;border-radius:8px;border:none;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer}
    .meta{color:#6b7280;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <div class="card" id="card">
    <h2>Panel administracyjny</h2>
    <p id="who"></p>

    <div id="formArea">
      <label for="announcement">Nowy komunikat (krótko)</label>
      <textarea id="announcement" placeholder="Np. 15.03.2026 — przerwa techniczna, usługi ograniczone..."></textarea>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button id="publish">Zapisz (symulacja)</button>
        <button id="logout" style="background:#eef2ff;color:#0b5ed7;border:1px solid rgba(11,94,215,0.06)">Wyloguj</button>
      </div>
      <p class="meta">Uwaga: to jest panel symulacyjny. W produkcji zapisz komunikaty do bazy lub CMS.</p>
    </div>
  </div>

  <script>
    // Prosta ochrona klienta (symulacja)
    if (sessionStorage.getItem('bsp_admin') !== '1') {
      location.href = '/admin-login.html';
    } else {
      document.getElementById('who').textContent = 'Zalogowany: KASIA_rst (symulacja)';
    }

    document.getElementById('logout').addEventListener('click', function(){
      sessionStorage.removeItem('bsp_admin');
      location.href = '/admin-login.html';
    });

    document.getElementById('publish').addEventListener('click', function(){
      const text = document.getElementById('announcement').value.trim();
      if (!text) { alert('Wpisz treść komunikatu.'); return; }
      // Symulacja: zapis do localStorage jako archiwum komunikatów
      const key = 'bsp_announcements';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.unshift({ text: text, date: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(existing));
      alert('Komunikat zapisany lokalnie (symulacja). Aby opublikować, wdroż backend lub CMS.');
      document.getElementById('announcement').value = '';
    });
  </script>
</body>
</html>
