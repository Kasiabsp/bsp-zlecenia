<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Panel admin — BSP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;padding:28px;background:#f6f7fb}
    .card{max-width:900px;margin:20px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    h2{margin-top:0}
    label{display:block;font-weight:700;margin-top:10px}
    textarea{width:100%;min-height:120px;padding:10px;border-radius:8px;border:1px solid #e6e9ee}
    button{padding:10px 14px;border-radius:8px;border:none;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer}
    .btn-ghost{background:#eef2ff;color:#0b5ed7;border:1px solid rgba(11,94,215,0.06)}
    .meta{color:#6b7280;font-size:13px;margin-top:10px}
    .list{margin-top:14px}
    .list-item{background:#fbfdff;border-radius:8px;padding:10px;border:1px solid rgba(15,23,42,0.03);margin-bottom:8px}
  </style>
</head>
<body>
  <div class="card" id="card" role="main" aria-labelledby="panelTitle">
    <h2 id="panelTitle">Panel administracyjny</h2>
    <p id="who" class="meta"></p>

    <label for="announcement">Nowy komunikat (krótko)</label>
    <textarea id="announcement" placeholder="Np. 15.03.2026 — przerwa techniczna, usługi ograniczone..."></textarea>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="publish">Zapisz (symulacja)</button>
      <button id="logout" class="btn-ghost">Wyloguj</button>
    </div>

    <p class="meta">Uwaga: to jest panel symulacyjny. W produkcji zapisz komunikaty do bazy lub CMS.</p>

    <section class="list" aria-labelledby="archTitle">
      <h3 id="archTitle">Archiwum komunikatów (lokalne)</h3>
      <div id="archive"></div>
    </section>
  </div>

  <script>
    // Prosta ochrona klienta (symulacja)
    if (sessionStorage.getItem('bsp_admin') !== '1') {
      location.href = '../admin-login.html';
    } else {
      document.getElementById('who').textContent = 'Zalogowany: (symulacja)';
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }

    function renderArchive(){
      const key = 'bsp_announcements';
      const container = document.getElementById('archive');
      container.innerHTML = '';
      const items = JSON.parse(localStorage.getItem(key) || '[]');
      if (!items.length) {
        container.innerHTML = '<div class="meta">Brak zapisanych komunikatów.</div>';
        return;
      }
      items.forEach(it => {
        const d = document.createElement('div');
        d.className = 'list-item';
        d.innerHTML = '<strong>' + new Date(it.date).toLocaleString() + '</strong><div style="margin-top:6px">' + escapeHtml(it.text) + '</div>';
        container.appendChild(d);
      });
    }

    document.getElementById('publish').addEventListener('click', function(){
      const text = document.getElementById('announcement').value.trim();
      if (!text) { alert('Wpisz treść komunikatu.'); return; }
      const key = 'bsp_announcements';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.unshift({ text: text, date: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(existing));
      // trigger small sync token to notify other tabs
      try { localStorage.setItem('bsp_announcements_sync', Date.now().toString()); } catch(e){}
      document.getElementById('announcement').value = '';
      renderArchive();
      alert('Komunikat zapisany lokalnie (symulacja). Aby opublikować, wdroż backend lub CMS.');
    });

    document.getElementById('logout').addEventListener('click', function(){
      sessionStorage.removeItem('bsp_admin');
      location.href = '../aboutinfo.html';
    });

    // Init
    renderArchive();
  </script>
</body>
</html>
