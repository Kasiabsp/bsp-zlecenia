<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Panel admin — BSP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;padding:28px;background:#f6f7fb}
    .card{max-width:900px;margin:20px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,0.06)}
    h2{margin-top:0}
    textarea{width:100%;min-height:120px;padding:10px;border-radius:8px;border:1px solid #e6e9ee}
    button{padding:10px 14px;border-radius:8px;border:none;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer}
    .btn-ghost{background:#eef2ff;color:#0b5ed7;border:1px solid rgba(11,94,215,0.06)}
    .meta{color:#6b7280;font-size:13px;margin-top:10px}
    .list{margin-top:14px}
    .list-item{background:#fbfdff;border-radius:8px;padding:10px;border:1px solid rgba(15,23,42,0.03);margin-bottom:8px}
  </style>
</head>
<body>
  <div class="card" id="card" role="main" aria-labelledby="panelTitle">
    <h2 id="panelTitle">Panel administracyjny</h2>
    <p id="who" class="meta"></p>

    <label for="announcement">Nowy komunikat</label>
    <textarea id="announcement" placeholder="Np. 15.03.2026 — przerwa techniczna..."></textarea>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="publish">Zapisz</button>
      <button id="logout" class="btn-ghost">Wyloguj</button>
    </div>

    <p class="meta">Uwaga: to jest panel symulacyjny. W produkcji zapisz komunikaty do bazy lub CMS.</p>

    <section class="list" aria-labelledby="archTitle">
      <h3 id="archTitle">Archiwum komunikatów</h3>
      <div id="archive"></div>
    </section>
  </div>

  <script>
    const API = '/api';
    function getToken(){ return sessionStorage.getItem('bsp_token'); }
    function requireAuth(){ if (!getToken()) location.href = '/admin-login.html'; }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

    async function renderArchive(){
      try {
        const res = await fetch(API + '/announcements');
        const j = await res.json();
        const container = document.getElementById('archive');
        container.innerHTML = '';
        if (!j.ok || !Array.isArray(j.items) || j.items.length === 0) {
          container.innerHTML = '<div class="meta">Brak zapisanych komunikatów.</div>'; return;
        }
        j.items.forEach(it => {
          const d = document.createElement('div'); d.className='list-item';
          d.innerHTML = '<strong>' + new Date(it.date).toLocaleString() + '</strong><div style="margin-top:6px">' + escapeHtml(it.text) + '</div>';
          container.appendChild(d);
        });
      } catch (e) { console.error(e); }
    }

    document.getElementById('publish').addEventListener('click', async () => {
      const text = document.getElementById('announcement').value.trim();
      if (!text) { alert('Wpisz treść komunikatu.'); return; }
      const token = getToken();
      if (!token) { alert('Brak uprawnień.'); location.href = '/admin-login.html'; return; }
      try {
        const res = await fetch(API + '/announcements', {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer ' + token},
          body: JSON.stringify({ text })
        });
        const j = await res.json();
        if (res.ok && j.ok) {
          document.getElementById('announcement').value = '';
          renderArchive();
          alert('Komunikat zapisany lokalnie (symulacja).');
        } else {
          alert(j.error || 'Błąd zapisu.');
          if (res.status === 401) location.href = '/admin-login.html';
        }
      } catch (e) { console.error(e); alert('Błąd sieci.'); }
    });

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem('bsp_token');
      location.href = '/aboutinfo.html';
    });

    // Init
    requireAuth();
    renderArchive();
  </script>
</body>
</html>
