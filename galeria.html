<!-- Pełny kod galerii (wklej w miejsce, gdzie ma być galeria) -->
<section class="card" id="gallery-unified">
  <h2>Modele 3D i Pomiary</h2>
  <p class="muted">Modele fotogrametryczne i zdjęcia pomiarowe — ułożone naprzemiennie.</p>

  <div class="unified-grid" id="unified-grid">
    <!-- 1: Model 3D -->
    <div class="item model" data-src="assets/Mazurski-Zdrj-Tnie-5-30-2026-textured_model.glb" data-title="Budowa — 30.05.2026">
      <h4>Budowa — 30.05.2026</h4>
      <model-viewer class="preview-thumb" src="assets/Mazurski-Zdrj-Tnie-5-30-2026-textured_model.glb" camera-controls auto-rotate></model-viewer>
      <button class="btn model-preview" type="button">Podgląd</button>
    </div>

    <!-- 2: Pomiar (zdjęcie) -->
    <div class="item photo" data-src="assets/pomiar dachu.png" data-title="Pomiar dachu">
      <h4>Pomiar dachu</h4>
      <img class="preview-thumb" src="assets/pomiar dachu.png" alt="Pomiar dachu" width="241" height="220" loading="lazy">
      <button class="btn model-preview" type="button">Podgląd</button>
    </div>

    <!-- 3: Model 3D -->
    <div class="item model" data-src="assets/model.glb" data-title="Obiekt hydrotechniczny">
      <h4>Obiekt hydrotechniczny</h4>
      <model-viewer class="preview-thumb" src="assets/model.glb" camera-controls auto-rotate></model-viewer>
      <button class="btn model-preview" type="button">Podgląd</button>
    </div>

    <!-- Dodaj kolejne elementy w żądanej kolejności (np. model, photo, model) -->
  </div>
</section>

<!-- Wspólny modal -->
<div id="preview-modal" class="preview-modal" aria-hidden="true">
  <button id="preview-close" class="preview-close" aria-label="Zamknij">×</button>
  <div id="preview-inner" class="preview-inner" role="dialog" aria-modal="true"></div>
</div>

<!-- Style -->
<style>
  :root {
    --card-width: 280px;
    --thumb-w: 241px;
    --thumb-h: 220px;
    --accent: #0b66ff;
  }

  .unified-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
  }

  .item {
    width: var(--card-width);
    padding: 12px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(16,24,40,0.06);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .item h4 {
    margin: 0 0 8px 0;
    font-size: 16px;
    color: #0b1726;
  }

  .preview-thumb {
    width: var(--thumb-w);
    height: var(--thumb-h);
    object-fit: cover;
    border-radius: 4px;
    background: #f6f7f9;
  }

  model-viewer.preview-thumb {
    display: block;
    width: var(--thumb-w);
    height: var(--thumb-h);
    border-radius: 4px;
    background: #f6f7f9;
  }

  .btn.model-preview {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  /* Modal */
  .preview-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.8);
  }

  .preview-inner {
    position: relative;
    max-width: 95%;
    max-height: 95%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .preview-inner img,
  .preview-inner model-viewer {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .preview-close {
    position: absolute;
    top: 18px;
    right: 24px;
    font-size: 36px;
    color: #fff;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 10001;
  }

  /* Responsywność */
  @media (max-width: 900px) {
    .unified-grid { justify-content: center; }
    .item { width: 220px; }
    :root { --thumb-w: 200px; --thumb-h: 182px; }
  }
</style>

<!-- Skrypt -->
<script>
  (function(){
    const modal = document.getElementById('preview-modal');
    const inner = document.getElementById('preview-inner');
    const closeBtn = document.getElementById('preview-close');

    function isGLB(src) {
      try { return src.split('?')[0].toLowerCase().endsWith('.glb'); }
      catch (e) { return false; }
    }

    // Delegacja kliknięć na przyciski Podgląd
    document.addEventListener('click', function(e){
      const btn = e.target.closest('.model-preview');
      if (!btn) return;

      const item = btn.closest('.item');
      if (!item) return;

      const src = item.getAttribute('data-src');
      const title = item.getAttribute('data-title') || '';

      // Wyczyść poprzednią zawartość
      inner.innerHTML = '';

      if (!src) return;

      if (isGLB(src)) {
        // Tworzymy model-viewer w modalu (ładowany dopiero teraz)
        const mv = document.createElement('model-viewer');
        mv.setAttribute('src', src);
        mv.setAttribute('camera-controls', '');
        mv.setAttribute('auto-rotate', '');
        mv.setAttribute('style', 'width:100%; height:100%;');
        inner.appendChild(mv);
      } else {
        // Tworzymy obraz
        const img = document.createElement('img');
        img.src = encodeURI(src);
        img.alt = title;
        img.onload = function(){ /* opcjonalnie: obsługa sukcesu */ };
        img.onerror = function(){ img.alt = 'Nie udało się załadować obrazu.'; };
        inner.appendChild(img);
      }

      // Pokaż modal
      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden','false');
      closeBtn.focus();
    });

    // Zamknięcie
    function closeModal(){
      inner.innerHTML = '';
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden','true');
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e){
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeModal();
    });
  })();
</script>
