<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Logowanie admin — BSP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --accent:#0b5ed7;
      --danger:#b91c1c;
      --ok:#0a7a2a;
      --muted:#6b7280;
      --radius:10px;
      --shadow:0 8px 30px rgba(15,23,42,0.06);
      --maxw:420px;
      --gap:12px;
      --font:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:var(--font);
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }
    .card{
      width:100%;
      max-width:var(--maxw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }
    h1{font-size:18px;margin:0 0 6px}
    p.lead{margin:0;color:var(--muted);font-size:13px}
    form{margin-top:14px;display:grid;gap:var(--gap)}
    label{font-weight:700;font-size:13px}
    input[type="text"], input[type="password"]{
      width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ee;font-size:14px;
    }
    .row{display:flex;gap:8px;align-items:center}
    .btn{
      display:inline-block;padding:10px 14px;border-radius:8px;border:none;background:var(--accent);
      color:#fff;font-weight:700;cursor:pointer;
    }
    .btn.ghost{background:#eef2ff;color:var(--accent);border:1px solid rgba(11,94,215,0.06)}
    .msg{font-size:14px;margin-top:6px}
    .msg.error{color:var(--danger)}
    .msg.ok{color:var(--ok)}
    .hint{font-size:13px;color:var(--muted);margin-top:8px}
    .meta{font-size:12px;color:var(--muted);margin-top:10px}
    .controls{display:flex;gap:8px;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    @media (max-width:420px){
      .row{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Logowanie administratora</h1>
    <p class="lead">Dostęp do panelu administracyjnego — tryb testowy.</p>

    <form id="loginForm" autocomplete="off" novalidate>
      <div>
        <label for="login">Login</label>
        <input id="login" name="login" type="text" inputmode="text" autocomplete="username" aria-required="true" />
      </div>

      <div>
        <label for="pass">Hasło</label>
        <div class="row">
          <input id="pass" name="password" type="password" autocomplete="current-password" aria-required="true" />
          <button type="button" id="togglePass" class="btn ghost" aria-pressed="false" aria-label="Pokaż hasło">Pokaż</button>
        </div>
      </div>

      <div class="controls">
        <button id="btn" class="btn" type="submit">Zaloguj</button>
        <div id="attempts" class="small" aria-live="polite"></div>
      </div>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div class="hint">To jest klientowa symulacja logowania. Nie używaj tego mechanizmu do ochrony wrażliwych danych.</div>
      <div class="meta">Jeśli testujesz lokalnie, uruchom serwer HTTP (np. <code>python -m http.server 8000</code>).</div>
    </form>
  </main>

  <script>
    (function(){
      // === Konfiguracja (zmień tylko tu) ===
      const expectedLogin = 'KASIA_rst';
      const expectedPass  = 'rstkasia.2020';
      const redirectPath  = 'admin/index.html'; // względna ścieżka do panelu
      const maxAttempts   = 5;
      const lockoutMs     = 60_000; // 1 minuta blokady po przekroczeniu prób

      // === Elementy ===
      const form = document.getElementById('loginForm');
      const loginEl = document.getElementById('login');
      const passEl = document.getElementById('pass');
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const attemptsEl = document.getElementById('attempts');
      const toggleBtn = document.getElementById('togglePass');

      // === Stan lokalny (niebezpieczne, tylko testy) ===
      let attempts = Number(sessionStorage.getItem('bsp_login_attempts') || 0);
      let lockedUntil = Number(sessionStorage.getItem('bsp_locked_until') || 0);

      function updateAttemptsUI(){
        if (lockedUntil && Date.now() < lockedUntil) {
          const sec = Math.ceil((lockedUntil - Date.now())/1000);
          attemptsEl.textContent = `Zablokowane na ${sec}s`;
          btn.disabled = true;
          return;
        }
        attemptsEl.textContent = attempts ? `Próby: ${attempts}/${maxAttempts}` : '';
        btn.disabled = false;
      }

      function showMsg(text, type){
        msg.textContent = text;
        msg.className = 'msg ' + (type === 'ok' ? 'ok' : (type === 'error' ? 'error' : ''));
      }

      function lockout(){
        lockedUntil = Date.now() + lockoutMs;
        sessionStorage.setItem('bsp_locked_until', String(lockedUntil));
        attempts = 0;
        sessionStorage.setItem('bsp_login_attempts', String(attempts));
        updateAttemptsUI();
        showMsg('Zbyt wiele nieudanych prób. Spróbuj później.', 'error');
      }

      // Clear autofill values on load
      window.addEventListener('load', () => {
        loginEl.value = '';
        passEl.value = '';
        // If already logged in, redirect immediately
        if (sessionStorage.getItem('bsp_admin') === '1') {
          showMsg('Już zalogowano. Przekierowanie...', 'ok');
          setTimeout(()=> location.href = redirectPath, 400);
          return;
        }
        // If lock expired, clear
        if (lockedUntil && Date.now() >= lockedUntil) {
          lockedUntil = 0;
          sessionStorage.removeItem('bsp_locked_until');
        }
        updateAttemptsUI();
      });

      // Toggle password visibility
      toggleBtn.addEventListener('click', function(){
        const isHidden = passEl.type === 'password';
        passEl.type = isHidden ? 'text' : 'password';
        toggleBtn.textContent = isHidden ? 'Ukryj' : 'Pokaż';
        toggleBtn.setAttribute('aria-pressed', String(isHidden));
        passEl.focus();
      });

      // Submit handler
      form.addEventListener('submit', function(e){
        e.preventDefault();
        // Check lock
        if (lockedUntil && Date.now() < lockedUntil) {
          updateAttemptsUI();
          return;
        }

        const login = (loginEl.value || '').trim();
        const pass = (passEl.value || '');

        if (!login || !pass) {
          showMsg('Wypełnij login i hasło.', 'error');
          return;
        }

        // Simple, explicit comparison (cleartext) for testing
        if (login === expectedLogin && pass === expectedPass) {
          sessionStorage.setItem('bsp_admin', '1');
          sessionStorage.removeItem('bsp_login_attempts');
          sessionStorage.removeItem('bsp_locked_until');
          showMsg('Zalogowano. Przekierowanie...', 'ok');
          setTimeout(()=> location.href = redirectPath, 400);
          return;
        }

        // Failed attempt
        attempts = Math.min(maxAttempts, attempts + 1);
        sessionStorage.setItem('bsp_login_attempts', String(attempts));
        if (attempts >= maxAttempts) {
          lockout();
        } else {
          showMsg('Nieprawidłowy login lub hasło.', 'error');
        }
        updateAttemptsUI();
      });

      // Enter key on inputs triggers submit (form handles it)
      [loginEl, passEl].forEach(el => el.addEventListener('keydown', function(e){
        if (e.key === 'Enter') {
          // let form submit handle validation
        }
      }));
    })();
  </script>
</body>
</html>
