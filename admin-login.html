<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Logowanie admin — BSP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;background:#f6f7fb;padding:28px;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,0.06);width:360px}
    label{display:block;font-weight:700;margin:8px 0 6px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ee}
    button{margin-top:12px;padding:10px 14px;border-radius:8px;border:none;background:#0b5ed7;color:#fff;font-weight:700;cursor:pointer}
    .msg{margin-top:10px;color:#b91c1c;font-size:14px}
    .hint{font-size:13px;color:#6b7280;margin-top:8px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="t">
    <h2 id="t">Logowanie administratora</h2>

    <label for="login">Login</label>
    <input id="login" type="text" autocomplete="username" />

    <label for="pass">Hasło</label>
    <input id="pass" type="password" autocomplete="current-password" />

    <button id="btn">Zaloguj</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <div class="hint">To jest klientowa symulacja logowania. Nie używaj tego mechanizmu do ochrony wrażliwych danych.</div>
  </main>

  <script>
    function resolveApiBase(){
      const explicit = (window.BSP_API_BASE || '').trim();
      if (explicit) return explicit.replace(/\/$/, '');
      const metaBase = (document.querySelector('meta[name="bsp-api-base"]')?.content || '').trim();
      if (metaBase) return metaBase.replace(/\/$/, '');
      if (location.hostname.endsWith('pages.dev')) return 'https://bsp-zlecenia.onrender.com';
      if (['localhost', '127.0.0.1'].includes(location.hostname)) return 'http://127.0.0.1:3000';
      return '';
    }
    const API = resolveApiBase() + '/api';
    function showMsg(t, ok=false){ const el=document.getElementById('msg'); el.textContent=t; el.style.color = ok ? '#0a7a2a' : '#b91c1c'; }
    document.getElementById('btn').addEventListener('click', async () => {
      const u = document.getElementById('login').value.trim();
      const p = document.getElementById('pass').value;
      if (!u || !p) { showMsg('Wypełnij login i hasło.'); return; }
      try {
        const res = await fetch(API + '/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: u, password: p }) });
        const j = await res.json().catch(() => ({}));
        if (res.ok && j.token) {
          sessionStorage.setItem('bsp_token', j.token);
          showMsg('Zalogowano. Przekierowanie...', true);
          setTimeout(()=> location.href = '/admin/index.html', 400);
        } else {
          showMsg(j.error || 'Błąd logowania.');
        }
      } catch (e) {
        showMsg('Błąd sieci.');
        console.error(e);
      }
    });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') document.getElementById('btn').click(); });
  </script>
</body>
</html>
