<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Informacje — BSP Zlecenia</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="data.js"></script>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #fff;
      --muted: #6b7280;
      --accent: #0b5ed7;
      --radius: 12px;
      --maxw: 800px;
      --font: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    /* 🔥 Twój styl tła */
    body {
      margin: 0;
      font-family: var(--font);
      background-image: url("assets/Zrzut ekranu (17).png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      color: #111827;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    html { margin: 0; padding: 0; }

    .wrap {
      max-width: var(--maxw);
      margin: 40px auto;
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: #0b1220;
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .news-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .news-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
    }

    .news-item time {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .news-item .expires {
      font-size: 13px;
      color: #9a3412;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <header>
      <div class="logo" aria-hidden="true">BSP</div>
      <div>
        <h1 id="title">Informacje i aktualności</h1>
        <div class="subtitle">Komunikaty o przerwach technicznych i dostępności usług</div>
      </div>
    </header>

    <section id="news" class="news-list" aria-live="polite"></section>

    <footer>
      © <span id="year"></span> BSP Zlecenia
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function isExpired(item) {
      if (!item || !item.expires) return false;
      const ex = new Date(item.expires);
      return isNaN(ex.getTime()) ? false : (ex.getTime() < Date.now());
    }

    function renderAnnouncements(items) {
      const list = document.getElementById('news');
      list.innerHTML = '';

      const visible = items.filter(it => !isExpired(it));
      if (!visible.length) {
        const el = document.createElement('div');
        el.className = 'news-item';
        el.textContent = 'W dniach 15.07-6.08 usługi będą nie dostępne.';
        list.appendChild(el);
        return;
      }

      visible.forEach(it => {
        const el = document.createElement('article');
        el.className = 'news-item';

        const t = document.createElement('time');
        t.dateTime = it.date || new Date().toISOString();
        t.textContent = new Date(it.date || Date.now()).toLocaleString();

        const p = document.createElement('p');
        p.textContent = it.text || '';

        el.appendChild(t);
        el.appendChild(p);

        if (it.expires) {
          const ex = new Date(it.expires);
          if (!isNaN(ex.getTime())) {
            const exEl = document.createElement('div');
            exEl.className = 'expires';
            exEl.textContent = 'Wyświetlane do: ' + ex.toLocaleDateString();
            el.appendChild(exEl);
          }
        }

        list.appendChild(el);
      });
    }

    function loadAnnouncements() {
      if (window.BSP_ANNOUNCEMENTS) {
        renderAnnouncements(window.BSP_ANNOUNCEMENTS);
      } else {
        renderAnnouncements([]);
      }
    }

    window.addEventListener('DOMContentLoaded', loadAnnouncements);
  </script>
</body>
</html>
