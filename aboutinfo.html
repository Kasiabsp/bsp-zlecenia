<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Informacje — BSP Zlecenia</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--muted:#6b7280;--accent:#0b5ed7;--radius:12px;--maxw:980px}
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{font-family:system-ui,Arial;background:linear-gradient(180deg,var(--bg),#eef2ff);padding:28px;display:flex;justify-content:center}
    .wrap{width:100%;max-width:var(--maxw);background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(15,23,42,0.06)}
    header{display:flex;gap:12px;align-items:center}
    .logo{width:56px;height:56px;border-radius:10px;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
    h1{margin:0;font-size:20px}
    .subtitle{color:var(--muted);font-size:13px}
    .news-list{margin-top:18px;display:grid;gap:10px}
    .news-item{padding:12px;border-radius:10px;border:1px solid rgba(15,23,42,0.03);background:#fff}
    .news-item time{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
    .login-panel{margin-top:18px;padding:12px;border-radius:10px;background:#fbfdff;border:1px solid rgba(15,23,42,0.03)}
    .login-row{display:flex;gap:8px;align-items:center}
    input[type="text"],input[type="password"],textarea{padding:8px;border-radius:8px;border:1px solid #e6e9ee;font-size:14px}
    .btn{padding:10px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .btn.secondary{background:#eef2ff;color:var(--accent);border:1px solid rgba(11,94,215,0.06)}
    .admin-area{margin-top:14px;padding:12px;border-radius:10px;background:#fff9f0;border:1px solid rgba(15,23,42,0.03);display:none}
    .admin-controls{display:flex;gap:8px;align-items:center;margin-top:8px}
    .meta{color:var(--muted);font-size:13px;margin-top:10px}
    .small{font-size:13px;color:var(--muted)}
    .hidden{display:none}
    /* Accessibility focus */
    input:focus, button:focus, textarea:focus { outline:3px solid rgba(11,94,215,0.12); outline-offset:2px; }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <header>
      <div class="logo" aria-hidden="true">BSP</div>
      <div>
        <h1 id="title">Informacje i aktualności</h1>
        <div class="subtitle">Komunikaty o zmianach w realizacji usług, przerwach i ważne ogłoszenia</div>
      </div>
    </header>

    <section id="news" class="news-list" aria-live="polite"></section>

    <section class="login-panel" aria-labelledby="loginTitle">
     <h2 id="loginTitle" style="font-size:15px;margin:0 0 8px">Panel administracyjny (logowanie)</h2>

      <div class="login-row" style="gap:6px">
        <input id="login" type="text" placeholder="Login" autocomplete="username" style="flex:1" />
        <input id="password" type="password" placeholder="Hasło" autocomplete="current-password" />
        <button id="loginBtn" class="btn">Zaloguj</button>
      </div>

      <div id="loginMsg" class="meta" style="margin-top:8px;color:var(--muted)"></div>
      <div style="margin-top:8px" class="small">Dostęp administracyjny umożliwia publikowanie komunikatów widocznych na tej stronie.</div>
    </section>

    <section id="adminArea" class="admin-area" aria-hidden="true">
      <h3 style="margin:0 0 8px">Edytor aktualności</h3>
      <textarea id="announcement" placeholder="Treść komunikatu..." style="width:100%;min-height:100px"></textarea>
      <div class="admin-controls">
        <button id="publishBtn" class="btn">Opublikuj</button>
        <button id="logoutBtn" class="btn secondary">Wyloguj</button>
        <div id="adminMsg" class="meta" style="margin-left:auto"></div>
      </div>
    </section>

    <p class="meta">© <span id="year"></span> BSP Zlecenia</p>
  </main>

  <script>
    // --- Konfiguracja API i pomocnicze ---
    function resolveApiBase(){
      const explicit = (window.BSP_API_BASE || '').trim();
      if (explicit) return explicit.replace(/\/$/, '');
      const metaBase = (document.querySelector('meta[name="bsp-api-base"]')?.content || '').trim();
      if (metaBase) return metaBase.replace(/\/$/, '');
      if (location.hostname.endsWith('pages.dev')) return 'https://bsp-zlecenia.onrender.com';
      if (['localhost', '127.0.0.1'].includes(location.hostname)) return 'http://127.0.0.1:3000';
      return '';
    }
    const API_BASE = resolveApiBase();
    const API = API_BASE ? (API_BASE + '/api') : '';

    document.getElementById('year').textContent = new Date().getFullYear();

    // --- Local fallback admin credentials (obfuscated) ---
    // Username: KASIA_rst
    // Password: rstkasia.2020
    // Stored as base64 to avoid plain text in obvious form; client-side fallback only.
    const FALLBACK_USER_B64 = 'S0FTSUFfcnN0'; // base64 of "KASIA_rst"
    const FALLBACK_PASS_B64 = 'cnN0a2FzaWEuMjAyMA=='; // base64 of "rstkasia.2020"

    function b64Decode(s){ try { return atob(s); } catch(e){ return ''; } }
    function b64Encode(s){ try { return btoa(s); } catch(e){ return ''; } }

    // --- Token helpers ---
    function setToken(token){ sessionStorage.setItem('bsp_token', token); }
    function getToken(){ return sessionStorage.getItem('bsp_token'); }
    function clearToken(){ sessionStorage.removeItem('bsp_token'); }

    // --- UI helpers ---
    function showAdminArea(show){
      const area = document.getElementById('adminArea');
      area.style.display = show ? 'block' : 'none';
      area.setAttribute('aria-hidden', show ? 'false' : 'true');
      document.getElementById('loginMsg').textContent = show ? 'Zalogowano.' : '';
    }

    function renderAnnouncements(items){
      const list = document.getElementById('news');
      list.innerHTML = '';
      if (!items || !items.length){
        const el = document.createElement('div'); el.className='news-item'; el.textContent='Brak komunikatów.'; list.appendChild(el);
        return;
      }
      items.forEach(it => {
        const el = document.createElement('article'); el.className='news-item';
        const t = document.createElement('time'); t.dateTime = it.date || new Date().toISOString(); t.textContent = new Date(it.date || Date.now()).toLocaleString();
        const p = document.createElement('p'); p.textContent = it.text || '';
        el.appendChild(t); el.appendChild(p); list.appendChild(el);
      });
    }

    // --- Load announcements from API or fallback to localStorage ---
    async function loadAnnouncements(){
      // Try API first
      if (API){
        try {
          const res = await fetch(API + '/announcements');
          if (res.ok){
            const j = await res.json().catch(()=>({}));
            if (j && Array.isArray(j.items)) { renderAnnouncements(j.items); return; }
          }
        } catch(e){ /* ignore and fallback */ }
      }
      // Fallback: read from localStorage
      const raw = localStorage.getItem('bsp_announcements');
      if (raw){
        try {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) { renderAnnouncements(arr); return; }
        } catch(e){}
      }
      renderAnnouncements([]);
    }

    // --- Publish announcement (API if available, else localStorage) ---
    async function publishAnnouncement(text){
      const adminMsg = document.getElementById('adminMsg');
      adminMsg.textContent = '';
      if (!text) { adminMsg.textContent = 'Wpisz treść komunikatu.'; return; }

      // Try API if token present
      const token = getToken();
      if (API && token){
        try {
          const res = await fetch(API + '/announcements', {
            method: 'POST',
            headers: {'Content-Type':'application/json','Authorization':'Bearer ' + token},
            body: JSON.stringify({ text })
          });
          const j = await res.json().catch(()=>({}));
          if (res.ok && j.ok){
            adminMsg.textContent = 'Opublikowano.';
            await loadAnnouncements();
            setTimeout(()=> adminMsg.textContent = '', 2000);
            return;
          } else {
            if (res.status === 401){ clearToken(); showAdminArea(false); adminMsg.textContent = 'Sesja wygasła. Zaloguj ponownie.'; return; }
            adminMsg.textContent = j.error || 'Błąd publikacji (serwer).';
            return;
          }
        } catch(e){
          // fall through to local fallback
        }
      }

      // Local fallback: store in localStorage
      try {
        const raw = localStorage.getItem('bsp_announcements');
        const arr = raw ? JSON.parse(raw) : [];
        arr.unshift({ date: new Date().toISOString(), text });
        localStorage.setItem('bsp_announcements', JSON.stringify(arr.slice(0,50)));
        adminMsg.textContent = 'Opublikowano lokalnie.';
        await loadAnnouncements();
        setTimeout(()=> adminMsg.textContent = '', 2000);
      } catch(e){
        adminMsg.textContent = 'Błąd zapisu lokalnego.';
      }
    }

    // --- Login flow: try server login if API available, else fallback to client-side check ---
    async function attemptLogin(username, password){
      const loginMsg = document.getElementById('loginMsg');
      loginMsg.textContent = '';
      if (!username || !password){ loginMsg.textContent = 'Wypełnij login i hasło.'; return false; }

      // Try server login if API present
      if (API){
        try {
          const res = await fetch(API + '/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ username, password })
          });
          const j = await res.json().catch(()=>({}));
          if (res.ok && j.token){
            setToken(j.token);
            showAdminArea(true);
            return true;
          } else {
            // If server rejects, show message but still allow fallback
            loginMsg.textContent = j.error || 'Błąd logowania (serwer).';
            // continue to fallback
          }
        } catch(e){
          // network error -> fallback to local check
        }
      }

      // Client-side fallback: compare to obfuscated constants
      const expectedUser = b64Decode(FALLBACK_USER_B64);
      const expectedPass = b64Decode(FALLBACK_PASS_B64);
      if (username === expectedUser && password === expectedPass){
        // create a simple client token (not secure) and store it
        const token = 'local:' + b64Encode(username + ':' + Date.now());
        setToken(token);
        showAdminArea(true);
        return true;
      } else {
        loginMsg.textContent = 'Nieprawidłowy login lub hasło.';
        return false;
      }
    }

    // --- Event bindings ---
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const u = document.getElementById('login').value.trim();
      const p = document.getElementById('password').value;
      const ok = await attemptLogin(u, p);
      if (ok){
        document.getElementById('login').value = '';
        document.getElementById('password').value = '';
      }
    });

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const text = document.getElementById('announcement').value.trim();
      await publishAnnouncement(text);
      document.getElementById('announcement').value = '';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearToken();
      showAdminArea(false);
      document.getElementById('adminMsg').textContent = 'Wylogowano.';
      setTimeout(()=> document.getElementById('adminMsg').textContent = '', 2000);
    });

    // Allow Enter key to submit login
    document.getElementById('password').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loginBtn').click(); }
    });
    document.getElementById('login').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loginBtn').click(); }
    });

    // On load: fetch announcements and restore admin area if token exists
    window.addEventListener('load', async () => {
      await loadAnnouncements();
      if (getToken()){
        // Optionally verify token with server if API available
        if (API){
          try {
            const res = await fetch(API + '/me', { headers: { 'Authorization': 'Bearer ' + getToken() } });
            if (res.ok){ showAdminArea(true); return; }
            // else clear token and hide
            clearToken();
            showAdminArea(false);
          } catch(e){
            // network error: assume token valid (local fallback)
            showAdminArea(true);
          }
        } else {
          showAdminArea(true);
        }
      }
    });

    // Small accessibility: focus first input on load
    window.addEventListener('DOMContentLoaded', () => {
      const l = document.getElementById('login');
      if (l) l.focus();
    });
  </script>
